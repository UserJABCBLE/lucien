<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>LUCIEN</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
<style>
/* 복사 방지: 선택·길게누르기·끌기·인쇄 막기 */
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
img,svg{-webkit-user-drag:none;user-drag:none}
@media print{body{display:none!important}}
</style>
</head>
<body>
<main class="wrap"><article class="sheet" id="sheet"><p class="loading">불러오는 중…</p></article></main>

<div class="music" id="music" hidden>
  <button class="disc" id="disc" type="button" aria-label="배경음악 재생">
    <svg viewBox="0 0 40 40" aria-hidden="true">
      <g class="rec"><circle cx="20" cy="20" r="17" fill="#1d1b18"/><circle cx="20" cy="20" r="12.5" fill="none" stroke="#3a3630" stroke-width=".6"/><circle cx="20" cy="20" r="9" fill="none" stroke="#3a3630" stroke-width=".6"/><circle cx="20" cy="20" r="5.5" fill="#9a8459"/><circle cx="20" cy="20" r="1.2" fill="#fffdf8"/></g>
      <path class="pl" d="M17.5 16.2v7.6l6.2-3.8z" fill="#fffdf8"/>
      <g class="pz" fill="#fffdf8"><rect x="17.2" y="16.6" width="2" height="6.8" rx=".6"/><rect x="20.8" y="16.6" width="2" height="6.8" rx=".6"/></g>
    </svg>
  </button>
  <span class="hint" id="hint" role="status">눌러서 음악 켜기</span>
</div>
<div id="yt" aria-hidden="true"></div>

<script src="assets/codec.js"></script>
<script>
{
/* ── 복사 방지 ── */
['copy', 'cut', 'contextmenu', 'dragstart', 'selectstart'].forEach(ev =>
  document.addEventListener(ev, e => e.preventDefault()));
document.addEventListener('keydown', e => {
  const k = (e.key || '').toLowerCase();
  if ((e.ctrlKey || e.metaKey) && ['c', 'x', 'a', 's', 'p', 'u'].includes(k)) e.preventDefault();
  if ((e.ctrlKey || e.metaKey) && e.shiftKey && ['i', 'j', 'c'].includes(k)) e.preventDefault();
  if (k === 'f12') e.preventDefault();
});
window.addEventListener('beforeprint', () => { document.body.style.display = 'none'; });
window.addEventListener('afterprint', () => { document.body.style.display = ''; });

const $ = s => document.querySelector(s);
const sheet = $('#sheet'), music = $('#music'), disc = $('#disc'), hint = $('#hint');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => Number(n || 0).toLocaleString('ko-KR');
let D = {site: {title: 'LUCIEN'}, series: [], posts: []};
const byId = id => D.posts.find(p => p.id === id);
const seriesOf = p => D.series.find(s => s.id === p.series) || {name: ''};

/* ── 데이터 불러오기 (글 목록은 한 번, 본문은 글을 열 때) ── */
const fresh = path => fetch(`${path}?v=${Date.now()}`, {cache: 'no-store'})
  .then(r => { if (!r.ok) throw new Error(r.status); return r.text(); })
  .then(LogCodec.decode);
const bodies = {};
function getBody(id) {
  if (!bodies[id]) bodies[id] = fresh(`posts/${id}.txt`).then(o => o.html).catch(e => { delete bodies[id]; throw e; });
  return bodies[id];
}

/* ── 조회수 (GoatCounter: 사이트 설정에 코드가 있을 때만) ── */
let gc = '';
function setupCounter() {
  gc = (D.site.goatcounter || '').trim();
  if (!/^[a-z0-9-]+$/i.test(gc)) { gc = ''; return; }
  window.goatcounter = {no_onload: true};
  const s = document.createElement('script');
  s.async = true; s.src = 'https://gc.zgo.at/count.js';
  s.dataset.goatcounter = `https://${gc}.goatcounter.com/count`;
  document.head.appendChild(s);
}
// 관리자 화면에서 '내 조회 빼기'를 켠 브라우저는 세지 않는다
let mine = false;
try { mine = localStorage.getItem('lucien-nocount') === '1'; } catch (e) {}
function count(path, title) {
  if (!gc || mine) return;
  let tries = 0;
  const go = () => window.goatcounter && window.goatcounter.count ? window.goatcounter.count({path, title})
    : (++tries < 25 && setTimeout(go, 400));
  go();
}

/* ── 목록 ── */
function renderHome() {
  document.title = D.site.title;
  const groups = D.series.map(s => {
    const items = D.posts.filter(p => p.series === s.id);
    if (!items.length) return '';
    return `<section class="series"><h2>${esc(s.name)}</h2>
      ${s.desc ? `<p>${esc(s.desc)}</p>` : ''}
      <ol class="list">${items.map(p => `<li><a href="#log-${esc(p.id)}" data-id="${esc(p.id)}">
        <span class="no">${esc(p.id)}</span>
        <span class="ttl">${esc(p.title)}<span>${esc(p.hanja)}</span></span>
        <span class="ex">${esc(p.excerpt)}</span>
        <span class="meta"><span>${fmt(p.chars)}자</span>${p.bgm ? '<span>♪ BGM</span>' : ''}</span>
      </a></li>`).join('')}</ol></section>`;
  }).join('');
  sheet.innerHTML = `<div class="view">
    <header class="site-head"><h1>${esc(D.site.title)}</h1><p>${esc(D.site.subtitle)}</p></header>
    ${groups || '<p class="loading">아직 올라온 글이 없어요.</p>'}</div>`;
  music.hidden = true;
  count('/', D.site.title);
}

/* ── 글 ── */
function renderPost(p) {
  const s = seriesOf(p);
  const list = D.posts.filter(x => x.series === p.series);
  const i = list.indexOf(p), prev = list[i - 1], next = list[i + 1];
  document.title = `${p.id}. ${p.title} · ${D.site.title}`;
  sheet.innerHTML = `<div class="view">
    <div class="bar" id="bar"><button class="back" type="button" data-home>
      <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M11 3 5 9l6 6" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>목록</button>
      <span class="crumb">${esc(s.name)} · ${esc(p.id)}. ${esc(p.title)}</span><span class="prog" id="prog"></span></div>
    <header class="post-head"><p class="kicker">${esc(s.name)} · ${esc(p.id)}</p>
      <h1 tabindex="-1" id="ph">${esc(p.title)}<span>${esc(p.hanja)}</span></h1>
      <svg class="orn" viewBox="0 0 120 18" aria-hidden="true"><path d="M0 9h50M70 9h50" stroke="currentColor" stroke-width=".8"/><path d="M60 5l4 4-4 4-4-4z" fill="currentColor"/></svg></header>
    <div class="doc" id="doc"><p class="loading">불러오는 중…</p></div>
    <nav class="pager">
      ${prev ? `<a href="#log-${esc(prev.id)}" data-id="${esc(prev.id)}"><small>← 이전 글</small>${esc(prev.id)}. ${esc(prev.title)}</a>` : '<span></span>'}
      ${next ? `<a class="nx" href="#log-${esc(next.id)}" data-id="${esc(next.id)}"><small>다음 글 →</small>${esc(next.id)}. ${esc(next.title)}</a>` : ''}
    </nav>
    <button class="tolist" type="button" data-home>목록으로</button></div>`;
  music.hidden = !p.bgm;
  getBody(p.id).then(html => {
    // 본문은 관리자 화면의 변환기가 만든 정해진 태그만 담는다
    if (current === p) $('#doc').innerHTML = html;
  }).catch(() => {
    if (current === p) $('#doc').innerHTML = '<p class="loading">글을 불러오지 못했어요. 잠시 뒤 새로고침해 주세요.</p>';
  });
  count('/log-' + p.id, `${p.id}. ${p.title}`);
}

/* ── 화면 전환 ── */
let current = null;
function show(id, gesture) {
  const p = id && byId(id);
  current = p || null;
  if (p) { playFor(p, gesture); renderPost(p); }   // 클릭 직후 바로 음악부터
  else { pauseMusic(); renderHome(); }
  window.scrollTo(0, 0);
  const h = $('#ph'); if (h) h.focus({preventScroll: true});
}
function idFromHash() { const m = location.hash.match(/^#log-(\w+)$/); return m ? m[1] : null; }
function go(id) {
  const target = id ? '#log-' + id : '#home';
  if (location.hash !== target) history.pushState(null, '', target);
  show(id, true);
}
sheet.addEventListener('click', e => {
  const a = e.target.closest('a[data-id]');
  if (a) { e.preventDefault(); go(a.dataset.id); return; }
  if (e.target.closest('[data-home]')) go(null);
});
window.addEventListener('popstate', () => show(idFromHash(), false));
window.addEventListener('hashchange', () => { const id = idFromHash(); if ((current && current.id) !== id) show(id, false); });
window.addEventListener('scroll', () => {
  const bar = $('#bar'), prog = $('#prog'); if (!bar) return;
  bar.classList.toggle('on', window.scrollY > 10);
  const max = document.documentElement.scrollHeight - innerHeight;
  prog.style.width = (max > 0 ? Math.min(100, window.scrollY / max * 100) : 0) + '%';
}, {passive: true});

/* ── 배경음악 (YouTube) ── */
let player = null, ready = false, failed = false, loadedVid = null, pending = null, sayT = 0, checkT = 0;
function setHint(text, mode) {
  hint.textContent = text;
  music.classList.toggle('ask', mode === 'ask');
  music.classList.toggle('say', mode === 'say');
  music.classList.remove('quiet');
  clearTimeout(sayT);
  if (mode === 'say') sayT = setTimeout(() => music.classList.remove('say'), 2600);
  if (mode === 'ask') sayT = setTimeout(() => music.classList.add('quiet'), 4000);
}
function setPlaying(on) {
  music.classList.toggle('playing', on);
  disc.setAttribute('aria-label', on ? '배경음악 멈춤' : '배경음악 재생');
  if (on) music.classList.remove('ask');
}
function loadYT() {
  window.onYouTubeIframeAPIReady = () => {
    player = new YT.Player('yt', {width: 200, height: 200,
      playerVars: {playsinline: 1, controls: 0, disablekb: 1, rel: 0, fs: 0, iv_load_policy: 3},
      events: {
        onReady: () => { ready = true; if (pending) { const v = pending; pending = null; start(v); } },
        onStateChange: e => {
          if (e.data === 1) setPlaying(true);
          else if (e.data === 2) setPlaying(false);
          else if (e.data === 0) { player.seekTo(0, true); player.playVideo(); }
        },
        onError: () => { setPlaying(false); setHint('음악을 불러오지 못했어요', 'say'); }
      }});
  };
  const s = document.createElement('script');
  s.src = 'https://www.youtube.com/iframe_api';
  s.onerror = () => { failed = true; };
  document.head.appendChild(s);
  setTimeout(() => { if (!ready) failed = true; }, 9000);
}
function start(vid) {
  if (loadedVid === vid) player.playVideo();
  else { player.loadVideoById({videoId: vid}); loadedVid = vid; }
  player.unMute(); player.setVolume(70);
  clearTimeout(checkT);
  checkT = setTimeout(() => {
    if (current && current.bgm === vid && player.getPlayerState() !== 1) setHint('눌러서 음악 켜기', 'ask');
  }, 1800);
}
function playFor(p, gesture) {
  if (!p.bgm) { pauseMusic(); return; }
  if (failed) { setHint('이 화면에서는 음악을 틀 수 없어요', 'say'); return; }
  if (!ready) { pending = p.bgm; if (!gesture) setHint('눌러서 음악 켜기', 'ask'); return; }
  if (loadedVid === p.bgm && player.getPlayerState() === 1) return;
  start(p.bgm);
}
function pauseMusic() {
  clearTimeout(checkT); pending = null;
  if (ready && player.getPlayerState() === 1) player.pauseVideo();
  setPlaying(false); music.classList.remove('ask', 'say');
}
disc.addEventListener('click', () => {
  if (!current || !current.bgm) return;
  if (failed || !ready) { setHint(failed ? '이 화면에서는 음악을 틀 수 없어요' : '음악을 준비하고 있어요', 'say'); if (!failed) pending = current.bgm; return; }
  if (player.getPlayerState() === 1) player.pauseVideo();
  else start(current.bgm);
});

loadYT();
fresh('posts/list.txt').then(data => {
  D = data; D.site = D.site || {}; D.series = D.series || []; D.posts = D.posts || [];
  setupCounter();
  show(idFromHash(), false);
}).catch(() => {
  sheet.innerHTML = '<p class="loading">목록을 불러오지 못했어요. 잠시 뒤 새로고침해 주세요.</p>';
});
}
</script>
</body>
</html>
